<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>3D T-Shirt Viewport</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Cinzel:wght@700&family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;900&family=Oswald:wght@600&family=Pacifico&family=Permanent+Marker&family=Playfair+Display:ital,wght@0,700;1,700&family=Space+Mono:wght@700&display=swap"
    rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body,
    html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 40%, #202432 0%, #12141c 65%, #090a0e 100%);
    }

    #canvas3d {
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
      cursor: grab;
      touch-action: none;
      -webkit-touch-callout: none;
    }

    #canvas3d.cursor-drag {
      cursor: move !important;
    }

    #canvas3d:active {
      cursor: grabbing;
    }
  </style>
</head>

<body>
  <canvas id="canvas3d"></canvas>

  <script src="js/three.min.js"></script>
  <script src="js/OrbitControls.js"></script>
  <script src="js/GLTFLoader.js"></script>
  <script src="js/DecalGeometry.js"></script>

  <script>
    // --- 3D APPLICATION STATE ---
    const engineState = {
      shirtColor: '', // Empty: raw model color initially
      activeFabric: '', // Empty: no fabric selected initially
      fabricRoughness: 0.88,
      interactionMode: 'orbit',
      autoRotate: false,
      layers: [], // Empty: no text or image decals initially
      selectedLayerId: null
    };

    const FABRIC_DEFINITIONS = {
      cotton: { roughness: 0.88, metalness: 0.0, normalScale: 0.45 },
      dryfit: { roughness: 0.48, metalness: 0.05, normalScale: 0.55 },
      fleece: { roughness: 0.95, metalness: 0.0, normalScale: 0.80 },
      silk: { roughness: 0.20, metalness: 0.12, normalScale: 0.25 },
      linen: { roughness: 0.92, metalness: 0.0, normalScale: 0.75 },
      denim: { roughness: 0.82, metalness: 0.02, normalScale: 0.70 }
    };

    const FABRIC_TEXTURES = {};

    let scene, camera, renderer, controls;
    let shirtMesh = null;
    let origMaterial = null;
    let raycaster, mouse;
    let currentFabricNormalMap = null;
    let isDragging = false;

    // Lighting
    let ambientLight, dirLight1, dirLight2, dirLight3;

    // Layer runtime mapping: layerId -> { decalMesh, canvas, texture, imageObj }
    const layerRuntime = {};

    function init3D() {
      const canvas = document.getElementById('canvas3d');

      scene = new THREE.Scene();

      // Start with a reasonable default; onWindowResize() will correct it immediately
      camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 0.05, 1.85);

      renderer = new THREE.WebGLRenderer({
        canvas: canvas,
        antialias: true,
        alpha: true,
        preserveDrawingBuffer: true
      });
      // Keep the 100% CSS size while setting the initial WebGL drawing buffer.
      renderer.setSize(window.innerWidth, window.innerHeight, false);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.15;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.minDistance = 0.6;
      controls.maxDistance = 3.5;
      controls.target.set(0, 0, 0);
      controls.maxPolarAngle = Math.PI * 0.85;
      controls.minPolarAngle = Math.PI * 0.15;
      controls.enabled = true;
      controls.enableRotate = true;
      controls.enableZoom = true;
      controls.enablePan = true;

      raycaster = new THREE.Raycaster();
      mouse = new THREE.Vector2();

      setupLighting('studio');

      // Soft Shadow Ground Plane
      const groundGeo = new THREE.PlaneGeometry(3, 3);
      const shadowCanvas = document.createElement('canvas');
      shadowCanvas.width = 256;
      shadowCanvas.height = 256;
      const sCtx = shadowCanvas.getContext('2d');
      const radGrad = sCtx.createRadialGradient(128, 128, 10, 128, 128, 115);
      radGrad.addColorStop(0, 'rgba(0, 0, 0, 0.45)');
      radGrad.addColorStop(0.5, 'rgba(0, 0, 0, 0.12)');
      radGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      sCtx.fillStyle = radGrad;
      sCtx.fillRect(0, 0, 256, 256);
      const shadowTex = new THREE.CanvasTexture(shadowCanvas);
      const groundMat = new THREE.MeshBasicMaterial({
        map: shadowTex,
        transparent: true,
        opacity: 0.7,
        depthWrite: false
      });
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.rotation.x = -Math.PI / 2;
      ground.position.y = -0.52;
      scene.add(ground);

      loadModel('models/tshirt-mockup.glb');

      window.addEventListener('resize', onWindowResize);

      // Pointer events for drag and selection on 3D Shirt
      canvas.addEventListener('pointerdown', onCanvasPointerDown);
      window.addEventListener('pointermove', onWindowPointerMove);
      window.addEventListener('pointerup', onWindowPointerUp);

      animate();

      // Observe the canvas for size changes caused by Flutter layout changes
      // (e.g. 60% → 100% when HUD collapses). Do this INSIDE init3D so
      // camera/renderer are guaranteed to exist when the callback fires.
      if (window.ResizeObserver) {
        const ro = new ResizeObserver(() => { requestAnimationFrame(onWindowResize); });
        ro.observe(canvas);
        ro.observe(document.documentElement);
      }
    }

    function setupLighting(preset) {
      if (ambientLight) scene.remove(ambientLight);
      if (dirLight1) scene.remove(dirLight1);
      if (dirLight2) scene.remove(dirLight2);
      if (dirLight3) scene.remove(dirLight3);

      ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
      scene.add(ambientLight);

      dirLight1 = new THREE.DirectionalLight(0xffffff, 1.0);
      dirLight1.position.set(1.5, 2.5, 2.5);
      scene.add(dirLight1);

      dirLight2 = new THREE.DirectionalLight(0xffffff, 0.6);
      dirLight2.position.set(-2, 1.5, -2);
      scene.add(dirLight2);

      dirLight3 = new THREE.DirectionalLight(0xffffff, 0.4);
      dirLight3.position.set(0, -1, 2);
      scene.add(dirLight3);

      if (preset === 'warm') {
        dirLight1.color.setHex(0xffedd5);
        dirLight2.color.setHex(0xfed7aa);
        ambientLight.color.setHex(0xfff7ed);
      } else if (preset === 'cool') {
        dirLight1.color.setHex(0xcffafe);
        dirLight2.color.setHex(0xf3e8ff);
        ambientLight.color.setHex(0xf0fdfa);
      } else if (preset === 'dramatic') {
        ambientLight.intensity = 0.3;
        dirLight1.intensity = 1.7;
        dirLight1.position.set(2.5, 3, 1.8);
        dirLight2.intensity = 0.9;
      }
    }

    // --- PROCEDURAL FABRIC NORMAL MAP GENERATOR ---
    function generateFabricNormalMap(type) {
      if (FABRIC_TEXTURES[type]) return FABRIC_TEXTURES[type];

      const size = 256;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      const heightData = new Float32Array(size * size);
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          let h = 0;
          if (type === 'cotton') {
            const u = x * 0.45;
            const v = y * 0.45;
            h = Math.sin(u) * Math.cos(v) * 0.5 + Math.sin((u + v) * 0.8) * 0.3;
          } else if (type === 'dryfit') {
            const cx = (x % 16) - 8;
            const cy = (y % 16) - 8;
            const dist = Math.sqrt(cx * cx + cy * cy);
            h = -Math.exp(-(dist * dist) / 12) * 0.85 + Math.sin(x * 0.8) * 0.15;
          } else if (type === 'fleece') {
            const u = x * 0.3;
            const v = y * 0.3;
            h = Math.sin(u * 2 + Math.cos(v * 2)) * 0.6 + Math.sin(v * 3) * 0.4;
          } else if (type === 'silk') {
            h = Math.sin(x * 1.5) * 0.2 + Math.cos(y * 0.1) * 0.1;
          } else if (type === 'linen') {
            const slubX = Math.sin(x * 0.25) * (Math.sin(x * 0.05) > 0.4 ? 1.5 : 0.4);
            const slubY = Math.cos(y * 0.25) * (Math.cos(y * 0.05) > 0.4 ? 1.5 : 0.4);
            h = (slubX + slubY) * 0.5;
          } else if (type === 'denim') {
            const diag = (x + y) * 0.7;
            h = Math.sin(diag) * 0.7 + Math.cos((x - y) * 0.2) * 0.3;
          }
          heightData[y * size + x] = h;
        }
      }

      const imgData = ctx.createImageData(size, size);
      const data = imgData.data;
      const strength = 2.4;

      for (let y = 0; y < size; y++) {
        const ym1 = (y - 1 + size) % size;
        const yp1 = (y + 1) % size;
        for (let x = 0; x < size; x++) {
          const xm1 = (x - 1 + size) % size;
          const xp1 = (x + 1) % size;

          const tl = heightData[ym1 * size + xm1];
          const t = heightData[ym1 * size + x];
          const tr = heightData[ym1 * size + xp1];
          const l = heightData[y * size + xm1];
          const r = heightData[y * size + xp1];
          const bl = heightData[yp1 * size + xm1];
          const b = heightData[yp1 * size + x];
          const br = heightData[yp1 * size + xp1];

          const dx = (tr + 2 * r + br) - (tl + 2 * l + bl);
          const dy = (bl + 2 * b + br) - (tl + 2 * t + tr);
          const dz = 1.0 / strength;

          const len = Math.sqrt(dx * dx + dy * dy + dz * dz) || 1;
          const nx = -dx / len;
          const ny = -dy / len;
          const nz = dz / len;

          const idx = (y * size + x) * 4;
          data[idx] = Math.floor((nx * 0.5 + 0.5) * 255);
          data[idx + 1] = Math.floor((ny * 0.5 + 0.5) * 255);
          data[idx + 2] = Math.floor((nz * 0.5 + 0.5) * 255);
          data[idx + 3] = 255;
        }
      }
      ctx.putImageData(imgData, 0, 0);

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(35, 35);
      texture.anisotropy = 4;

      FABRIC_TEXTURES[type] = texture;
      return texture;
    }

    function applyFabric(fabricKey, roughness) {
      engineState.activeFabric = fabricKey;

      if (!shirtMesh || !shirtMesh.material) return;

      if (!fabricKey || fabricKey.trim() === '') {
        // Revert to clean original model material
        if (origMaterial) {
          shirtMesh.material.normalMap = origMaterial.normalMap;
          shirtMesh.material.roughness = origMaterial.roughness;
          shirtMesh.material.metalness = origMaterial.metalness;
          shirtMesh.material.needsUpdate = true;
        }
        currentFabricNormalMap = null;
        return;
      }

      const config = FABRIC_DEFINITIONS[fabricKey] || FABRIC_DEFINITIONS.cotton;
      currentFabricNormalMap = generateFabricNormalMap(fabricKey);

      const finalRoughness = roughness !== undefined ? roughness : config.roughness;

      shirtMesh.material.normalMap = currentFabricNormalMap;
      shirtMesh.material.normalScale.set(config.normalScale, config.normalScale);
      shirtMesh.material.roughness = finalRoughness;
      shirtMesh.material.metalness = config.metalness;
      shirtMesh.material.needsUpdate = true;

      // Propagate fabric texture to all decals
      Object.values(layerRuntime).forEach(rt => {
        if (rt.decalMesh && rt.decalMesh.material) {
          rt.decalMesh.material.normalMap = currentFabricNormalMap;
          rt.decalMesh.material.normalScale.set(config.normalScale * 0.6, config.normalScale * 0.6);
          rt.decalMesh.material.needsUpdate = true;
        }
      });
    }

    // --- MODEL LOADING ---
    function loadModel(path) {
      const loader = new THREE.GLTFLoader();
      const cacheBuster = '?v=' + Date.now();
      const paths = [
        path + cacheBuster,
        'models/tshirt-mockup.glb' + cacheBuster,
        'assets/assets/tshirt-mockup.glb' + cacheBuster,
        'assets/tshirt-mockup.glb' + cacheBuster
      ];

      function tryLoadPath(idx) {
        if (idx >= paths.length) {
          console.error('All GLB model paths failed.');
          return;
        }
        loader.load(
          paths[idx],
          function (gltf) {
            onModelLoaded(gltf);
          },
          undefined,
          function (err) {
            tryLoadPath(idx + 1);
          }
        );
      }
      tryLoadPath(0);
    }

    function onModelLoaded(gltf) {
      if (shirtMesh && shirtMesh.parent) {
        scene.remove(shirtMesh.parent);
      }

      const root = gltf.scene;
      root.traverse(function (child) {
        if (child.isMesh) {
          shirtMesh = child;
          shirtMesh.castShadow = true;
          shirtMesh.receiveShadow = true;

          if (shirtMesh.material) {
            origMaterial = shirtMesh.material.clone();
            shirtMesh.material = shirtMesh.material.clone();
          }
        }
      });

      const box = new THREE.Box3().setFromObject(root);
      const center = box.getCenter(new THREE.Vector3());
      root.position.sub(center);

      scene.add(root);

      // Only apply color or fabric if user has explicitly chosen one
      if (engineState.shirtColor && engineState.shirtColor.trim() !== '') {
        updateShirtColor();
      }
      if (engineState.activeFabric && engineState.activeFabric.trim() !== '') {
        applyFabric(engineState.activeFabric, engineState.fabricRoughness);
      }

      // Notify Flutter that 3D engine is ready
      sendToFlutter({ type: 'READY' });
    }

    function onWindowResize() {
      if (!camera || !renderer) return;
      const width = window.innerWidth;
      const height = window.innerHeight;
      if (width <= 0 || height <= 0) return;

      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height, false);
      renderer.render(scene, camera);
    }

    function animate() {
      requestAnimationFrame(animate);

      if (engineState.autoRotate) {
        scene.rotation.y += 0.007;
      }

      controls.update();
      renderer.render(scene, camera);
    }

    // --- INTERACTION: DRAG & SELECTION ---
    function onCanvasPointerDown(e) {
      if (!shirtMesh) return;

      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);

      // In orbit mode: allow normal 3D rotation by OrbitControls!
      // Only select layer on quick tap without disabling rotation
      if (engineState.interactionMode === 'orbit' && !e.shiftKey) {
        if (controls) controls.enabled = true;
        const decalMeshes = Object.values(layerRuntime).map(rt => rt.decalMesh).filter(m => m !== null);
        if (decalMeshes.length > 0) {
          const decalHits = raycaster.intersectObjects(decalMeshes, false);
          if (decalHits.length > 0) {
            const hitMesh = decalHits[0].object;
            if (hitMesh.userData && hitMesh.userData.layerId) {
              sendToFlutter({
                type: 'LAYER_SELECTED',
                layerId: hitMesh.userData.layerId
              });
            }
          }
        }
        return; // OrbitControls handles the rotation smoothly!
      }

      // Check hit on shirt mesh for drag
      const intersects = raycaster.intersectObject(shirtMesh, true);
      if (intersects.length > 0) {
        const hit = intersects[0];
        if (engineState.interactionMode === 'drag' || e.shiftKey) {
          isDragging = true;
          if (controls) controls.enabled = false;
          handleDragHit(hit);
          e.preventDefault();
        }
      }
    }

    function onWindowPointerMove(e) {
      if (!isDragging || !shirtMesh) return;

      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObject(shirtMesh, true);
      if (intersects.length > 0) {
        handleDragHit(intersects[0]);
      }
    }

    function onWindowPointerUp() {
      if (isDragging) {
        isDragging = false;
        if (engineState.interactionMode === 'orbit') {
          controls.enabled = true;
        }
      }
    }

    function handleDragHit(hit) {
      if (!engineState.layers || engineState.layers.length === 0) return;
      const activeLayer = engineState.layers.find(l => l.id === engineState.selectedLayerId) || engineState.layers[engineState.layers.length - 1];
      if (!activeLayer) return;

      const worldPos = hit.point.clone();
      const worldNorm = hit.face.normal.clone().transformDirection(shirtMesh.matrixWorld).normalize();

      activeLayer.pos = { x: worldPos.x, y: worldPos.y, z: worldPos.z };
      activeLayer.norm = { x: worldNorm.x, y: worldNorm.y, z: worldNorm.z };

      // Update decal in real time
      const stackIndex = engineState.layers.indexOf(activeLayer);
      renderLayerDecal(activeLayer, stackIndex);

      // Post back to Flutter
      sendToFlutter({
        type: 'LAYER_MOVED',
        layerId: activeLayer.id,
        pos: activeLayer.pos,
        norm: activeLayer.norm
      });
    }

    function createDecalOrientation(pos, norm, rotationAngle) {
      const helper = new THREE.Object3D();
      helper.position.copy(pos);
      const target = pos.clone().add(norm.clone().multiplyScalar(10));
      helper.lookAt(target);

      if (rotationAngle) {
        helper.rotateZ((rotationAngle * Math.PI) / 180);
      }
      return helper.rotation;
    }

    function updateShirtColor() {
      if (!shirtMesh || !shirtMesh.material) return;
      if (!engineState.shirtColor || engineState.shirtColor.trim() === '') {
        if (origMaterial) {
          shirtMesh.material.color.copy(origMaterial.color);
          shirtMesh.material.needsUpdate = true;
        }
        return;
      }
      shirtMesh.material.color.set(engineState.shirtColor);
      shirtMesh.material.needsUpdate = true;
    }

    // --- MULTI-LAYER DECAL ENGINE ---
    function syncLayers(newLayers) {
      engineState.layers = newLayers || [];

      // Clean up deleted layers
      const activeIds = new Set(engineState.layers.map(l => l.id));
      Object.keys(layerRuntime).forEach(id => {
        if (!activeIds.has(id)) {
          if (layerRuntime[id].decalMesh) {
            scene.remove(layerRuntime[id].decalMesh);
            layerRuntime[id].decalMesh.geometry.dispose();
          }
          delete layerRuntime[id];
        }
      });

      // Render each layer in stacking order (index 0 is bottom, last is top)
      engineState.layers.forEach((layer, idx) => {
        renderLayerDecal(layer, idx);
      });
    }

    function renderLayerDecal(layer, stackIndex) {
      if (!shirtMesh) return;

      let rt = layerRuntime[layer.id];
      if (!rt) {
        rt = {
          decalMesh: null,
          canvas: document.createElement('canvas'),
          texture: null,
          imageObj: null
        };
        layerRuntime[layer.id] = rt;
      }

      if (!layer.visible) {
        if (rt.decalMesh) {
          scene.remove(rt.decalMesh);
          rt.decalMesh.geometry.dispose();
          rt.decalMesh = null;
        }
        return;
      }

      if (layer.type === 'text') {
        renderTextDecal(layer, rt, stackIndex);
      } else if (layer.type === 'image') {
        renderImageDecal(layer, rt, stackIndex);
      }
    }

    function renderTextDecal(layer, rt, stackIndex) {
      if (rt.canvas.width !== 2048) {
        rt.canvas.width = 2048;
        rt.canvas.height = 1024;
      }
      if (!rt.texture) {
        rt.texture = new THREE.CanvasTexture(rt.canvas);
        rt.texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      }

      const ctx = rt.canvas.getContext('2d');
      ctx.clearRect(0, 0, 2048, 1024);

      let measuredW = 100;
      let measuredH = 100;

      if (layer.text && layer.text.trim().length > 0) {
        ctx.fillStyle = layer.textColor || '#111111';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        const renderFontSize = (layer.fontSize || 58) * 2.2;
        ctx.font = `bold ${renderFontSize}px ${layer.fontFamily || "'Bebas Neue', sans-serif"}`;

        if (layer.textArc && layer.textArc !== 0) {
          drawCurvedText(ctx, layer.text, 1024, 512, 420, (layer.textArc / 100) * 1.6);
          measuredW = 850;
          measuredH = 450;
        } else {
          const lines = layer.text.split('\n');
          const lineHeight = renderFontSize * 1.18;
          const startY = 512 - ((lines.length - 1) * lineHeight) / 2;

          lines.forEach((line, idx) => {
            const w = drawSpacedText(ctx, line, 1024, startY + idx * lineHeight, layer.textSpacing || 2);
            if (w > measuredW) measuredW = w;
          });
          measuredH = lines.length * lineHeight;
        }
        rt.texture.needsUpdate = true;
      } else {
        rt.texture.needsUpdate = true;
      }

      if (rt.decalMesh) {
        scene.remove(rt.decalMesh);
        rt.decalMesh.geometry.dispose();
        rt.decalMesh = null;
      }

      if (layer.text && layer.text.trim().length > 0 && layer.pos && layer.norm) {
        const pos = new THREE.Vector3(layer.pos.x, layer.pos.y, layer.pos.z);
        const norm = new THREE.Vector3(layer.norm.x, layer.norm.y, layer.norm.z);

        const scaleFactor = 0.00032;
        let decalW = Math.max(measuredW * scaleFactor * 1.4, 0.22);
        let decalH = Math.max(measuredH * scaleFactor * 1.4, 0.12);
        const size = new THREE.Vector3(decalW, decalH, 0.05);

        const orientation = createDecalOrientation(pos, norm, layer.rotation || 0);
        const decalGeo = new THREE.DecalGeometry(shirtMesh, pos, orientation, size);

        // Stacking order
        const decalMat = new THREE.MeshStandardMaterial({
          map: rt.texture,
          transparent: true,
          opacity: layer.opacity !== undefined ? layer.opacity : 1.0,
          depthTest: true,
          depthWrite: false,
          polygonOffset: true,
          polygonOffsetFactor: -3 - (stackIndex * 2),
          polygonOffsetUnits: -3 - (stackIndex * 2),
          roughness: 0.88,
          metalness: 0.0,
          normalMap: currentFabricNormalMap,
          normalScale: new THREE.Vector2(0.35, 0.35)
        });

        rt.decalMesh = new THREE.Mesh(decalGeo, decalMat);
        rt.decalMesh.renderOrder = 10 + stackIndex;
        rt.decalMesh.userData = { layerId: layer.id };
        scene.add(rt.decalMesh);
      }
    }

    function renderImageDecal(layer, rt, stackIndex) {
      if (rt.canvas.width !== 1024) {
        rt.canvas.width = 1024;
        rt.canvas.height = 1024;
      }
      if (!rt.texture) {
        rt.texture = new THREE.CanvasTexture(rt.canvas);
        rt.texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      }

      if (!layer.imageSrc) {
        if (rt.decalMesh) {
          scene.remove(rt.decalMesh);
          rt.decalMesh.geometry.dispose();
          rt.decalMesh = null;
        }
        return;
      }

      if (!rt.imageObj || rt.imageObj.src !== layer.imageSrc) {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => {
          rt.imageObj = img;
          drawAndBuildImageDecal(layer, rt, stackIndex);
        };
        img.src = layer.imageSrc;
      } else {
        drawAndBuildImageDecal(layer, rt, stackIndex);
      }
    }

    function drawAndBuildImageDecal(layer, rt, stackIndex) {
      const ctx = rt.canvas.getContext('2d');
      ctx.clearRect(0, 0, 1024, 1024);

      if (rt.imageObj) {
        ctx.save();
        ctx.translate(512, 512);

        const img = rt.imageObj;
        const maxDim = 880;

        let drawW, drawH;
        if (img.width > img.height) {
          drawW = maxDim;
          drawH = (img.height / img.width) * maxDim;
        } else {
          drawH = maxDim;
          drawW = (img.width / img.height) * maxDim;
        }

        ctx.drawImage(img, -drawW / 2, -drawH / 2, drawW, drawH);
        ctx.restore();
        rt.texture.needsUpdate = true;
      }

      if (rt.decalMesh) {
        scene.remove(rt.decalMesh);
        rt.decalMesh.geometry.dispose();
        rt.decalMesh = null;
      }

      if (rt.imageObj && layer.pos && layer.norm) {
        const pos = new THREE.Vector3(layer.pos.x, layer.pos.y, layer.pos.z);
        const norm = new THREE.Vector3(layer.norm.x, layer.norm.y, layer.norm.z);

        const scale = layer.scale || 1.0;
        const baseW = 0.24 * scale;
        const baseH = 0.24 * scale;
        const size = new THREE.Vector3(baseW, baseH, 0.05);

        const orientation = createDecalOrientation(pos, norm, layer.rotation || 0);
        const decalGeo = new THREE.DecalGeometry(shirtMesh, pos, orientation, size);

        const decalMat = new THREE.MeshStandardMaterial({
          map: rt.texture,
          transparent: true,
          opacity: layer.opacity !== undefined ? layer.opacity : 1.0,
          depthTest: true,
          depthWrite: false,
          polygonOffset: true,
          polygonOffsetFactor: -3 - (stackIndex * 2),
          polygonOffsetUnits: -3 - (stackIndex * 2),
          roughness: 0.85,
          metalness: 0.0,
          normalMap: currentFabricNormalMap,
          normalScale: new THREE.Vector2(0.35, 0.35)
        });

        rt.decalMesh = new THREE.Mesh(decalGeo, decalMat);
        rt.decalMesh.renderOrder = 10 + stackIndex;
        rt.decalMesh.userData = { layerId: layer.id };
        scene.add(rt.decalMesh);
      }
    }

    function drawSpacedText(ctx, text, x, y, spacing) {
      if (!spacing || spacing === 0) {
        ctx.fillText(text, x, y);
        return ctx.measureText(text).width;
      }
      const chars = text.split('');
      const widths = chars.map(c => ctx.measureText(c).width);
      const totalW = widths.reduce((a, b) => a + b, 0) + (chars.length - 1) * spacing;
      let curX = x - totalW / 2;
      chars.forEach((c, i) => {
        ctx.fillText(c, curX + widths[i] / 2, y);
        curX += widths[i] + spacing;
      });
      return totalW;
    }

    function drawCurvedText(ctx, text, cx, cy, radius, angleSpan) {
      const chars = text.split('');
      const step = angleSpan / (chars.length - 1 || 1);
      const startAngle = -angleSpan / 2;

      ctx.save();
      ctx.translate(cx, cy);
      chars.forEach((c, i) => {
        const angle = startAngle + i * step;
        ctx.save();
        ctx.rotate(angle);
        ctx.translate(0, -radius);
        ctx.fillText(c, 0, 0);
        ctx.restore();
      });
      ctx.restore();
    }

    // --- CAMERA SMOOTH NAVIGATION ---
    function setCameraView(view) {
      scene.rotation.y = 0;

      let targetCamPos = new THREE.Vector3(0, 0.05, 1.85);
      let targetLookAt = new THREE.Vector3(0, 0, 0);

      switch (view) {
        case 'front':
          targetCamPos.set(0, 0.05, 1.85);
          targetLookAt.set(0, 0, 0);
          break;
        case 'back':
          targetCamPos.set(0, 0.05, -1.85);
          targetLookAt.set(0, 0, 0);
          break;
        case 'left-sleeve':
          targetCamPos.set(1.65, 0.08, 0);
          targetLookAt.set(0.32, 0.08, 0);
          break;
        case 'right-sleeve':
          targetCamPos.set(-1.65, 0.08, 0);
          targetLookAt.set(-0.32, 0.08, 0);
          break;
        case 'closeup':
          targetCamPos.set(0, 0.12, 0.85);
          targetLookAt.set(0, 0.12, 0.15);
          break;
        case 'reset':
          targetCamPos.set(0, 0.05, 1.85);
          targetLookAt.set(0, 0, 0);
          break;
      }

      const duration = 600;
      const startCamPos = camera.position.clone();
      const startLookAt = controls.target.clone();
      const startTime = performance.now();

      function animateCam(now) {
        const elapsed = now - startTime;
        const t = Math.min(elapsed / duration, 1);
        const ease = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

        camera.position.lerpVectors(startCamPos, targetCamPos, ease);
        controls.target.lerpVectors(startLookAt, targetLookAt, ease);
        controls.update();

        if (t < 1) {
          requestAnimationFrame(animateCam);
        }
      }
      requestAnimationFrame(animateCam);
    }

    // --- BIDIRECTIONAL FLUTTER COMMUNICATION ---
    function sendToFlutter(messageObj) {
      const jsonStr = JSON.stringify(messageObj);

      if (window.parent && window.parent !== window) {
        window.parent.postMessage(messageObj, '*');
      }

      if (window.FlutterBridge && typeof window.FlutterBridge.postMessage === 'function') {
        window.FlutterBridge.postMessage(jsonStr);
      }
    }

    window.flutterBridgeReceive = function (command) {
      let data = command;
      if (typeof command === 'string') {
        try {
          data = JSON.parse(command);
        } catch (e) {
          console.error('Failed to parse flutter command:', e);
          return;
        }
      }

      if (!data || !data.type) return;

      switch (data.type) {
        case 'SYNC_STATE':
          engineState.shirtColor = data.shirtColor || '';
          updateShirtColor();

          engineState.activeFabric = data.activeFabric || '';
          applyFabric(engineState.activeFabric, data.fabricRoughness);

          if (data.interactionMode) {
            engineState.interactionMode = data.interactionMode;
            if (controls) {
              controls.enabled = (data.interactionMode === 'orbit');
            }
            const canvasEl = document.getElementById('canvas3d');
            if (canvasEl) {
              canvasEl.classList.toggle('cursor-drag', data.interactionMode === 'drag');
            }
          }
          if (data.autoRotate !== undefined) {
            engineState.autoRotate = data.autoRotate;
          }
          if (data.lighting) {
            setupLighting(data.lighting);
          }
          if (data.layers) {
            syncLayers(data.layers);
          }
          break;

        case 'SET_CAMERA':
          if (data.view) setCameraView(data.view);
          break;

        case 'SET_INTERACTION_MODE':
          if (data.mode) {
            engineState.interactionMode = data.mode;
            if (controls) {
              controls.enabled = (data.mode === 'orbit');
            }
            const canvasEl = document.getElementById('canvas3d');
            if (canvasEl) {
              canvasEl.classList.toggle('cursor-drag', data.mode === 'drag');
            }
          }
          break;

        case 'SET_LIGHTING':
          if (data.preset) setupLighting(data.preset);
          break;

        case 'SET_AUTO_ROTATE':
          engineState.autoRotate = !!data.enabled;
          break;

        case 'LOAD_MODEL':
          if (data.modelPath) loadModel(data.modelPath);
          break;

        case 'RESIZE':
          onWindowResize();
          break;

        case 'EXPORT_PNG':
          renderer.render(scene, camera);
          const dataUrl = renderer.domElement.toDataURL('image/png');
          sendToFlutter({ type: 'EXPORTED_PNG', dataUrl: dataUrl });
          break;
      }
    };

    window.addEventListener('message', (event) => {
      if (event.data) {
        window.flutterBridgeReceive(event.data);
      }
    });

    function start3D() {
      init3D();
      // After DOM paint, re-sync renderer size to actual canvas element size
      requestAnimationFrame(() => {
        onWindowResize();
        // Second delayed resize for WebView/iframe environments where layout settles late
        setTimeout(onWindowResize, 300);
        setTimeout(onWindowResize, 800);
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', start3D, { once: true });
    } else {
      start3D();
    }
  </script>
</body>

</html>
